name: Daily AI Internship Tracker

on:
  schedule:
    - cron: '0 0 * * *' # Executes automatically every single day at midnight UTC
  workflow_dispatch: # Allows you to run it manually anytime with a single click

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-numeric-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Execute Tracker Script
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: python tracker.py
